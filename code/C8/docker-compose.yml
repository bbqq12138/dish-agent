services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage # 数据持久化目录

  mongodb:
    image: mongo:latest
    container_name: mongodb_server
    ports:
      - "27017:27017" # MongoDB默认端口
    volumes:
      - ./mongodb_data:/data/db # 数据持久化目录
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminbbq